name: Publish FitCheck 1.9.1 OTA

on:
  push:
    branches: [ main ]
    paths:
      - 'publish/trigger-191.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download signed FitCheck 1.9.1 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-73ec-820e-8f6d-07698f2dddcf/raw?se=2026-10-07T20%3A03%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=4940f581-5c3a-53f9-8d56-aba5a159d143&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T12%3A29%3A35Z&ske=2026-10-08T12%3A29%3A35Z&sks=b&skv=2026-02-06&sig=9Q%2BuIVAd2qgFtDYmg7O3FmKajsrcVSjQ7PP3HAdir1Y%3D' -o artifact.zip
          echo '270acd91a545f8d2dc22f69ec7165fff810ddc9d7f67e5ea2564a20515776b2b  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d artifact
          test -s artifact/FitCheck-1.9.1.apk
          echo 'fbf7fd3142c726ad7154dbc1c0751902d4e247c6e59b9fcd04cc1f9103435132  artifact/FitCheck-1.9.1.apk' | sha256sum -c -

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          apk = pathlib.Path('artifact/FitCheck-1.9.1.apk').read_bytes()
          payload = {
              'message': 'Publish FitCheck 1.9.1 OTA APK',
              'content': base64.b64encode(apk).decode(),
              'branch': 'main'
          }
          pathlib.Path('apk-payload.json').write_text(json.dumps(payload))
          PY
          existing="$(gh api /repos/${{ github.repository }}/contents/releases/FitCheck-1.9.1.apk --jq .sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            python3 - <<PY
          import json
          p=json.load(open('apk-payload.json')); p['sha']='$existing'; open('apk-payload.json','w').write(json.dumps(p))
          PY
          fi
          gh api --method PUT /repos/${{ github.repository }}/contents/releases/FitCheck-1.9.1.apk --input apk-payload.json

      - name: Publish OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > update.json.new <<'JSON'
          {
            "versionCode": 18,
            "versionName": "1.9.1",
            "apkUrl": "https://raw.githubusercontent.com/fsfalch/FitCheck-Releases/main/releases/FitCheck-1.9.1.apk",
            "sha256": "fbf7fd3142c726ad7154dbc1c0751902d4e247c6e59b9fcd04cc1f9103435132",
            "notes": "FitCheck 1.9.1 — Mapa & Detalhes GPS: mapa real do percurso nas atividades outdoor e nova tela de detalhes com rota, distância, tempo, ritmo/velocidade e contexto.",
            "mandatory": false
          }
          JSON
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          data = pathlib.Path('update.json.new').read_bytes()
          sha = subprocess.check_output(
              ['gh','api',f"/repos/{__import__('os').environ['GITHUB_REPOSITORY']}/contents/update.json",'--jq','.sha'],
              text=True
          ).strip()
          payload = {
              'message': 'Publish FitCheck 1.9.1 OTA manifest',
              'content': base64.b64encode(data).decode(),
              'branch': 'main',
              'sha': sha
          }
          pathlib.Path('manifest-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT /repos/${{ github.repository }}/contents/update.json --input manifest-payload.json
