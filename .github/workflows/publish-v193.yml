name: Publish FitCheck 1.9.3 OTA

on:
  push:
    branches: [ main ]
    paths:
      - 'publish/trigger-193.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download signed FitCheck 1.9.3 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7430-820e-a910-63b37510cf39/raw?se=2026-10-29T19%3A28%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=0568d059-70ff-5251-bad9-2f7901526b33&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A11%3A11Z&ske=2026-10-30T15%3A11%3A11Z&sks=b&skv=2026-02-06&sig=zPAU0fmrGmDLlPCmsMHDZtrWJw1MoXzT7nQP1V/Ybf0%3D' -o artifact.zip
          echo '06c350dacbcf153fa721845d43a693233778f279b31609083c231395dd8ce61e  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d artifact
          test -s artifact/FitCheck-1.9.3.apk
          echo '3728692098cf50854c5a39b93bd8992f61561316c4df5ad714e2a7d8015364e8  artifact/FitCheck-1.9.3.apk' | sha256sum -c -

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          apk = pathlib.Path('artifact/FitCheck-1.9.3.apk').read_bytes()
          payload = {'message':'Publish FitCheck 1.9.3 OTA APK','content':base64.b64encode(apk).decode(),'branch':'main'}
          pathlib.Path('apk-payload.json').write_text(json.dumps(payload))
          PY
          existing="$(gh api /repos/${{ github.repository }}/contents/releases/FitCheck-1.9.3.apk --jq .sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            python3 - <<PY
          import json
          p=json.load(open('apk-payload.json')); p['sha']='$existing'; open('apk-payload.json','w').write(json.dumps(p))
          PY
          fi
          gh api --method PUT /repos/${{ github.repository }}/contents/releases/FitCheck-1.9.3.apk --input apk-payload.json

      - name: Publish OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > update.json.new <<'JSON'
          {
            "versionCode": 20,
            "versionName": "1.9.3",
            "apkUrl": "https://raw.githubusercontent.com/fsfalch/FitCheck-Releases/main/releases/FitCheck-1.9.3.apk",
            "sha256": "3728692098cf50854c5a39b93bd8992f61561316c4df5ad714e2a7d8015364e8",
            "notes": "FitCheck 1.9.3 — Hotfix: Novidades da versão agora acompanha automaticamente a versão instalada; título e informações de release corrigidos.",
            "mandatory": false
          }
          JSON
          python3 - <<'PY'
          import base64, json, pathlib, subprocess, os
          data=pathlib.Path('update.json.new').read_bytes()
          sha=subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/contents/update.json",'--jq','.sha'],text=True).strip()
          payload={'message':'Publish FitCheck 1.9.3 OTA manifest','content':base64.b64encode(data).decode(),'branch':'main','sha':sha}
          pathlib.Path('manifest-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT /repos/${{ github.repository }}/contents/update.json --input manifest-payload.json
