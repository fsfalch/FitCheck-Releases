name: Publish FitCheck 1.8.1 OTA

on:
  push:
    branches: [ main ]
    paths:
      - 'publish/trigger-181.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download signed FitCheck 1.8.1 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-50f0-820e-93ab-30e18ee0491e/raw?se=2026-10-07T15%3A30%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=0715c2ab-07bd-5861-abbf-878732433664&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T12%3A29%3A39Z&ske=2026-10-08T12%3A29%3A39Z&sks=b&skv=2026-02-06&sig=Qk5P8k4F7yyrNjqNUBs6Np36PTMGC8hFcUPZYoEx4Hw%3D' -o artifact.zip
          echo 'c165e9713feff4b7beaf57b519720a176a1423eb8d2470e06b20c2a6e5ece03c  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d artifact
          test -s artifact/FitCheck-1.8.1.apk
          echo '8e7156afddc09c4658d78ce06e4a2d0e54eae52a4631382ae58152afeeb2dd78  artifact/FitCheck-1.8.1.apk' | sha256sum -c -

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          apk = pathlib.Path('artifact/FitCheck-1.8.1.apk').read_bytes()
          payload = {
              'message': 'Publish FitCheck 1.8.1 OTA APK',
              'content': base64.b64encode(apk).decode(),
              'branch': 'main'
          }
          pathlib.Path('apk-payload.json').write_text(json.dumps(payload))
          PY
          existing="$(gh api /repos/${{ github.repository }}/contents/releases/FitCheck-1.8.1.apk --jq .sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            python3 - <<PY
          import json
          p=json.load(open('apk-payload.json')); p['sha']='$existing'; open('apk-payload.json','w').write(json.dumps(p))
          PY
          fi
          gh api --method PUT /repos/${{ github.repository }}/contents/releases/FitCheck-1.8.1.apk --input apk-payload.json

      - name: Publish OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > update.json.new <<'JSON'
          {
            "versionCode": 16,
            "versionName": "1.8.1",
            "apkUrl": "https://raw.githubusercontent.com/fsfalch/FitCheck-Releases/main/releases/FitCheck-1.8.1.apk",
            "sha256": "8e7156afddc09c4658d78ce06e4a2d0e54eae52a4631382ae58152afeeb2dd78",
            "notes": "FitCheck 1.8.1 — Polimento: troca de tema preserva a aba atual e o detalhe da atividade abre já alinhado, sem deslocamento visual.",
            "mandatory": false
          }
          JSON
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          data = pathlib.Path('update.json.new').read_bytes()
          sha = subprocess.check_output(
              ['gh','api',f"/repos/{__import__('os').environ['GITHUB_REPOSITORY']}/contents/update.json",'--jq','.sha'],
              text=True
          ).strip()
          payload = {
              'message': 'Publish FitCheck 1.8.1 OTA manifest',
              'content': base64.b64encode(data).decode(),
              'branch': 'main',
              'sha': sha
          }
          pathlib.Path('manifest-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT /repos/${{ github.repository }}/contents/update.json --input manifest-payload.json
